[project]
name = "greenwheels-mcp"
version = "0.1.0"
description = "MCP server proxying GreenWheels operator REST API"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==4.0.5",
    "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
