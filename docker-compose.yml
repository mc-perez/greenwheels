services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: greenwheels
      POSTGRES_PASSWORD: greenwheels
      POSTGRES_DB: greenwheels
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenwheels -d greenwheels"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://greenwheels:greenwheels@db:5432/greenwheels
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://greenwheels:greenwheels@db:5432/greenwheels
    depends_on:
      db:
        condition: service_healthy
    command: ["pytest", "-q"]
    profiles:
      - test

volumes:
  pgdata:
