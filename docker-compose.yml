services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: greenwheels
      POSTGRES_PASSWORD: greenwheels
      POSTGRES_DB: greenwheels
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenwheels -d greenwheels"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    image: greenwheels-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://greenwheels:greenwheels@db:5432/greenwheels
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'')"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

  test:
    image: greenwheels-api
    environment:
      DATABASE_URL: postgresql+psycopg://greenwheels:greenwheels@db:5432/greenwheels
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m alembic upgrade head && pytest -q"]
    profiles:
      - test

  mcp:
    build:
      context: ./mcp-server
    image: greenwheels-mcp
    stdin_open: true
    tty: false
    environment:
      GREENWHEELS_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - mcp

  test-mcp:
    image: greenwheels-mcp
    command: ["pytest", "-q"]
    profiles:
      - test-mcp

volumes:
  pgdata:
